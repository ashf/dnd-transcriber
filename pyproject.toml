[project]
name = "dnd-transcriber"
version = "0.1.0"
description = "Transcribe D&D session recordings and clean them up into spoiler-free, speaker-attributed transcripts"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.7.0",
    "whisperx>=3.8.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
wiki = [
    "mkdocs-material>=9.8.2",
]
